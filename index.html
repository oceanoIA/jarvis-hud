<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S. — AR SYSTEM</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
        crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
        crossorigin="anonymous"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Consolas", "Courier New", monospace;
}

/* =========================================================
   REAL CAMERA
   ========================================================= */

#webcam {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    z-index: 1;

    background: #000;
}


/* =========================================================
   AR CANVAS
   ========================================================= */

#arCanvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 10;

    pointer-events: none;
}


/* =========================================================
   HOLOGRAM PANEL
   ========================================================= */

#hologram {

    position: fixed;

    width: 360px;
    height: 235px;

    left: 50%;
    top: 50%;

    z-index: 20;

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%, -50%)
        scale(.55)
        rotate(0deg);

    transform-origin: center center;

    transition:
        opacity .18s ease;

    background:
        linear-gradient(
            180deg,
            rgba(0, 235, 255, .12),
            rgba(0, 120, 180, .035)
        );

    border: 1px solid rgba(0, 238, 255, .75);

    box-shadow:
        0 0 4px rgba(0, 238, 255, .8),
        0 0 20px rgba(0, 238, 255, .25),
        inset 0 0 35px rgba(0, 238, 255, .08);

    backdrop-filter: blur(2px);

    overflow: hidden;
}

#hologram.active {
    opacity: .92;
}


/* image */

#holoImage {

    position: absolute;

    inset: 9px;

    width: calc(100% - 18px);
    height: calc(100% - 18px);

    object-fit: cover;

    opacity: .58;

    filter:
        saturate(.75)
        contrast(1.15)
        brightness(.82);

    mix-blend-mode: screen;
}


/* blue glass layer */

#holoGlass {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,255,255,.05),
            transparent 35%,
            transparent 65%,
            rgba(0,255,255,.04)
        );

    pointer-events: none;
}


/* scanlines */

#holoScan {

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(0,240,255,.08) 4px
        );

    opacity: .65;

    animation: scanMove 4s linear infinite;
}

@keyframes scanMove {

    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 120px;
    }
}


/* =========================================================
   CORNER BRACKETS
   ========================================================= */

.corner {

    position: absolute;

    width: 25px;
    height: 25px;

    border-color: #bfffff;

    filter:
        drop-shadow(0 0 5px #00eaff);
}

.corner.tl {
    top: -1px;
    left: -1px;
    border-top: 2px solid;
    border-left: 2px solid;
}

.corner.tr {
    top: -1px;
    right: -1px;
    border-top: 2px solid;
    border-right: 2px solid;
}

.corner.bl {
    bottom: -1px;
    left: -1px;
    border-bottom: 2px solid;
    border-left: 2px solid;
}

.corner.br {
    bottom: -1px;
    right: -1px;
    border-bottom: 2px solid;
    border-right: 2px solid;
}


/* =========================================================
   HOLO INFORMATION
   ========================================================= */

.holoTop {

    position: absolute;

    top: 14px;
    left: 18px;

    color: #eaffff;

    font-size: 9px;

    letter-spacing: 2px;

    text-shadow:
        0 0 7px #00eaff;
}

.holoTop span {

    color: #00eaff;

    margin-left: 8px;
}

.holoBottom {

    position: absolute;

    bottom: 13px;
    left: 18px;

    color: rgba(170,245,255,.8);

    font-size: 8px;

    letter-spacing: 1.5px;
}


/* =========================================================
   START SCREEN
   ========================================================= */

#startup {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    transition:
        opacity .5s ease;
}

#startup.hidden {
    opacity: 0;
    pointer-events: none;
}

.startInner {

    text-align: center;

    color: #dfffff;
}

.startMain {

    font-size: 15px;

    letter-spacing: 7px;

    margin-bottom: 16px;

    text-shadow:
        0 0 12px #00eaff;
}

.startSub {

    font-size: 8px;

    letter-spacing: 3px;

    color: rgba(0,240,255,.65);

    animation: pulseText 1.5s infinite;
}

@keyframes pulseText {

    0%,
    100% {
        opacity: .35;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================================
   SMALL SYSTEM STATUS
   ========================================================= */

#status {

    position: fixed;

    left: 24px;
    bottom: 20px;

    z-index: 30;

    color: rgba(150,245,255,.55);

    font-size: 8px;

    letter-spacing: 2px;

    opacity: 0;

    transition: opacity .4s;
}

#status.active {
    opacity: 1;
}


/* =========================================================
   RESPONSIVE HOLOGRAM
   ========================================================= */

@media (max-width: 700px) {

    #hologram {
        width: 280px;
        height: 185px;
    }

    .startMain {
        font-size: 12px;
        letter-spacing: 4px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     REAL WORLD CAMERA
     ======================================================= -->

<video
    id="webcam"
    autoplay
    playsinline
    muted>
</video>


<!-- =======================================================
     AR GRAPHICS
     ======================================================= -->

<canvas id="arCanvas"></canvas>


<!-- =======================================================
     HOLOGRAPHIC OBJECT
     ======================================================= -->

<div id="hologram">

    <img
        id="holoImage"
        crossorigin="anonymous"
        src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1000&auto=format&fit=crop">

    <div id="holoGlass"></div>
    <div id="holoScan"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="holoTop">
        HOLOGRAPHIC DISPLAY
        <span>ACTIVE</span>
    </div>

    <div class="holoBottom">
        SYS 03 / VISUAL DATA / LINK ESTABLISHED
    </div>

</div>


<!-- =======================================================
     STARTUP
     ======================================================= -->

<div id="startup">

    <div class="startInner">

        <div class="startMain">
            J.A.R.V.I.S.
        </div>

        <div class="startSub">
            INITIALIZING AUGMENTED REALITY SYSTEM
        </div>

    </div>

</div>


<div id="status">
    J.A.R.V.I.S. // AR LINK
</div>


<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const video =
    document.getElementById("webcam");

const canvas =
    document.getElementById("arCanvas");

const ctx =
    canvas.getContext("2d");

const hologram =
    document.getElementById("hologram");

const startup =
    document.getElementById("startup");

const status =
    document.getElementById("status");


/* =========================================================
   STATE
   ========================================================= */

let detectedHands = [];

let smoothHand = null;

let smoothPanel = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2,
    scale: .8,
    angle: 0
};

let targetPanel = {
    x: window.innerWidth / 2,
    y: window.innerHeight / 2,
    scale: .8,
    angle: 0
};

let ringTime = 0;

let lastDetectionTime = 0;

let firstDetection = false;


/* =========================================================
   RESIZE
   ========================================================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   VIDEO → SCREEN COORDINATES
   =========================================================

   MediaPipe vede l'immagine originale.

   La camera invece viene mostrata specchiata
   e con object-fit: cover.

   Questa funzione mantiene perfettamente
   l'allineamento degli elementi AR.
   ========================================================= */

function landmarkToScreen(lm) {

    const vw =
        video.videoWidth || 1280;

    const vh =
        video.videoHeight || 720;

    const cw =
        canvas.width;

    const ch =
        canvas.height;


    const scale =
        Math.max(
            cw / vw,
            ch / vh
        );


    const rw =
        vw * scale;

    const rh =
        vh * scale;


    const offsetX =
        (cw - rw) / 2;

    const offsetY =
        (ch - rh) / 2;


    return {

        x:
            offsetX +
            (1 - lm.x) * rw,

        y:
            offsetY +
            lm.y * rh
    };
}


/* =========================================================
   DISTANCE
   ========================================================= */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}


/* =========================================================
   ANGLE
   ========================================================= */

function angleBetween(a, b) {

    return Math.atan2(
        b.y - a.y,
        b.x - a.x
    );
}


/* =========================================================
   RING
   ========================================================= */

function drawRing(
    x,
    y,
    radius,
    time
) {

    ctx.save();

    ctx.translate(x, y);


    /* ---------------------------------------------
       GLOW
       --------------------------------------------- */

    ctx.shadowColor =
        "rgba(0,240,255,.95)";

    ctx.shadowBlur = 18;


    /* ---------------------------------------------
       MAIN CIRCLE
       --------------------------------------------- */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(0,235,255,.65)";

    ctx.lineWidth = 1.5;

    ctx.stroke();


    /* ---------------------------------------------
       OUTER BROKEN RING
       --------------------------------------------- */

    ctx.save();

    ctx.rotate(time * .25);

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius + 13,
        -0.35,
        1.05
    );

    ctx.strokeStyle =
        "rgba(0,245,255,.9)";

    ctx.lineWidth = 2;

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius + 13,
        2.0,
        3.25
    );

    ctx.strokeStyle =
        "rgba(0,245,255,.7)";

    ctx.lineWidth = 1;

    ctx.stroke();

    ctx.restore();


    /* ---------------------------------------------
       INNER ROTATING SEGMENTS
       --------------------------------------------- */

    ctx.save();

    ctx.rotate(-time * .42);

    for (let i = 0; i < 8; i++) {

        const start =
            i * (Math.PI * 2 / 8);

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            radius - 12,
            start,
            start + .28
        );

        ctx.strokeStyle =
            i % 2 === 0
            ? "rgba(140,255,255,.75)"
            : "rgba(0,210,255,.35)";

        ctx.lineWidth =
            i % 2 === 0 ? 2 : 1;

        ctx.stroke();
    }

    ctx.restore();


    /* ---------------------------------------------
       TICKS
       --------------------------------------------- */

    ctx.save();

    ctx.rotate(time * .12);

    for (let i = 0; i < 24; i++) {

        const a =
            i * Math.PI * 2 / 24;

        const longTick =
            i % 6 === 0;

        const r1 =
            radius + 18;

        const r2 =
            radius +
            (longTick ? 28 : 23);

        ctx.beginPath();

        ctx.moveTo(
            Math.cos(a) * r1,
            Math.sin(a) * r1
        );

        ctx.lineTo(
            Math.cos(a) * r2,
            Math.sin(a) * r2
        );

        ctx.strokeStyle =
            longTick
            ? "rgba(180,255,255,.8)"
            : "rgba(0,220,255,.4)";

        ctx.lineWidth =
            longTick ? 1.5 : 1;

        ctx.stroke();
    }

    ctx.restore();


    /* ---------------------------------------------
       TARGET CROSS
       --------------------------------------------- */

    ctx.strokeStyle =
        "rgba(190,255,255,.8)";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(-radius - 45, 0);
    ctx.lineTo(-radius - 20, 0);

    ctx.moveTo(radius + 20, 0);
    ctx.lineTo(radius + 45, 0);

    ctx.moveTo(0, -radius - 45);
    ctx.lineTo(0, -radius - 20);

    ctx.moveTo(0, radius + 20);
    ctx.lineTo(0, radius + 45);

    ctx.stroke();


    /* ---------------------------------------------
       CENTER
       --------------------------------------------- */

    ctx.shadowBlur = 12;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        3,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#dfffff";

    ctx.fill();


    /* ---------------------------------------------
       SWEEP
       --------------------------------------------- */

    const sweep =
        time % (Math.PI * 2);

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            Math.cos(sweep) * radius,
            Math.sin(sweep) * radius
        );

    gradient.addColorStop(
        0,
        "rgba(0,240,255,0)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,240,255,.55)"
    );

    ctx.strokeStyle =
        gradient;

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(0, 0);

    ctx.lineTo(
        Math.cos(sweep) * radius,
        Math.sin(sweep) * radius
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   SMALL TECHNICAL DATA
   ========================================================= */

function drawTrackingText(
    x,
    y,
    radius
) {

    ctx.save();

    ctx.font =
        "8px Consolas, monospace";

    ctx.fillStyle =
        "rgba(170,250,255,.72)";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur = 5;

    ctx.letterSpacing = "1px";

    ctx.fillText(
        "J.A.R.V.I.S. // LOCK",
        x + radius + 35,
        y - 20
    );

    ctx.fillText(
        "TRACKING",
        x + radius + 35,
        y - 7
    );

    ctx.fillStyle =
        "rgba(0,230,255,.5)";

    ctx.fillText(
        "AR-03",
        x + radius + 35,
        y + 6
    );

    ctx.restore();
}


/* =========================================================
   CONNECTION LINES
   ========================================================= */

function drawConnection(
    a,
    b
) {

    const midX =
        (a.x + b.x) / 2;

    const midY =
        (a.y + b.y) / 2;


    ctx.save();

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur = 8;

    ctx.strokeStyle =
        "rgba(0,240,255,.35)";

    ctx.lineWidth = 1;

    ctx.setLineDash([
        8,
        10
    ]);

    ctx.beginPath();

    ctx.moveTo(a.x, a.y);

    ctx.lineTo(
        midX,
        midY
    );

    ctx.lineTo(b.x, b.y);

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   PANEL TARGET
   ========================================================= */

function calculatePanel() {

    if (detectedHands.length < 2)
        return;


    const hand1 =
        detectedHands[0];

    const hand2 =
        detectedHands[1];


    const a =
        landmarkToScreen(
            hand1[8]
        );

    const b =
        landmarkToScreen(
            hand2[8]
        );


    const midX =
        (a.x + b.x) / 2;

    const midY =
        (a.y + b.y) / 2;


    const dist =
        distance(a, b);


    const rawScale =
        dist / 330;


    targetPanel.x =
        midX;

    targetPanel.y =
        midY;


    targetPanel.scale =
        Math.max(
            .55,
            Math.min(
                1.65,
                rawScale
            )
        );


    targetPanel.angle =
        angleBetween(a, b);
}


/* =========================================================
   SMOOTHING
   ========================================================= */

function smoothValue(
    current,
    target,
    amount
) {

    return (
        current +
        (target - current) * amount
    );
}


/* =========================================================
   UPDATE HOLOGRAM
   ========================================================= */

function updateHologram() {

    if (detectedHands.length < 2) {

        hologram.classList.remove(
            "active"
        );

        return;
    }


    smoothPanel.x =
        smoothValue(
            smoothPanel.x,
            targetPanel.x,
            .13
        );


    smoothPanel.y =
        smoothValue(
            smoothPanel.y,
            targetPanel.y,
            .13
        );


    smoothPanel.scale =
        smoothValue(
            smoothPanel.scale,
            targetPanel.scale,
            .12
        );


    let angleDifference =
        targetPanel.angle -
        smoothPanel.angle;


    while (
        angleDifference > Math.PI
    ) {
        angleDifference -=
            Math.PI * 2;
    }


    while (
        angleDifference < -Math.PI
    ) {
        angleDifference +=
            Math.PI * 2;
    }


    smoothPanel.angle +=
        angleDifference * .12;


    hologram.style.transform =

        `translate(-50%, -50%)
         translate(${smoothPanel.x}px, ${smoothPanel.y}px)
         scale(${smoothPanel.scale})
         rotate(${smoothPanel.angle}rad)`;


    hologram.classList.add(
        "active"
    );
}


/* =========================================================
   MEDIAPIPE
   ========================================================= */

function onResults(results) {

    detectedHands =
        results.multiHandLandmarks || [];


    if (detectedHands.length > 0) {

        lastDetectionTime =
            performance.now();


        if (!firstDetection) {

            firstDetection = true;

            startup.classList.add(
                "hidden"
            );

            status.classList.add(
                "active"
            );
        }


        /* -----------------------------------------
           PRIMARY HAND
           ----------------------------------------- */

        const primary =
            detectedHands[0];


        const wrist =
            landmarkToScreen(
                primary[0]
            );

        const index =
            landmarkToScreen(
                primary[8]
            );

        const middle =
            landmarkToScreen(
                primary[12]
            );

        const palmSize =
            distance(
                wrist,
                middle
            );


        const radius =
            Math.max(
                70,
                Math.min(
                    170,
                    palmSize * 1.55
                )
            );


        /* smooth primary hand */

        if (!smoothHand) {

            smoothHand = {
                x: index.x,
                y: index.y,
                radius
            };

        } else {

            smoothHand.x =
                smoothValue(
                    smoothHand.x,
                    index.x,
                    .22
                );

            smoothHand.y =
                smoothValue(
                    smoothHand.y,
                    index.y,
                    .22
                );

            smoothHand.radius =
                smoothValue(
                    smoothHand.radius,
                    radius,
                    .16
                );
        }


        calculatePanel();

    } else {

        /* slowly remove target */

        smoothHand = null;
    }
}


/* =========================================================
   RENDER LOOP
   ========================================================= */

function render() {

    requestAnimationFrame(
        render
    );


    ringTime += .018;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* -----------------------------------------------------
       PRIMARY HAND RING
       ----------------------------------------------------- */

    if (smoothHand) {

        drawRing(
            smoothHand.x,
            smoothHand.y,
            smoothHand.radius,
            ringTime
        );


        drawTrackingText(
            smoothHand.x,
            smoothHand.y,
            smoothHand.radius
        );
    }


    /* -----------------------------------------------------
       TWO HAND MODE
       ----------------------------------------------------- */

    if (
        detectedHands.length >= 2
    ) {

        const a =
            landmarkToScreen(
                detectedHands[0][8]
            );

        const b =
            landmarkToScreen(
                detectedHands[1][8]
            );


        drawConnection(
            a,
            b
        );


        /* finger lock points */

        ctx.save();

        for (const p of [a, b]) {

            ctx.shadowColor =
                "#00eaff";

            ctx.shadowBlur = 10;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                3,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#eaffff";

            ctx.fill();

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                10,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle =
                "rgba(0,240,255,.55)";

            ctx.lineWidth = 1;

            ctx.stroke();
        }

        ctx.restore();
    }


    /* -----------------------------------------------------
       HOLOGRAM
       ----------------------------------------------------- */

    updateHologram();


    /* -----------------------------------------------------
       LOST TRACKING
       ----------------------------------------------------- */

    if (
        performance.now() -
        lastDetectionTime > 700
    ) {

        hologram.classList.remove(
            "active"
        );
    }
}


/* =========================================================
   MEDIAPIPE INITIALIZATION
   ========================================================= */

const hands =
    new Hands({

        locateFile:
            (file) =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });


hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: .72,

    minTrackingConfidence: .72

});


hands.onResults(
    onResults
);


/* =========================================================
   CAMERA
   ========================================================= */

const camera =
    new Camera(
        video,
        {

            onFrame:
                async () => {

                    await hands.send({
                        image: video
                    });

                },

            width: 1280,

            height: 720

        }
    );


/* =========================================================
   START
   ========================================================= */

camera.start();

render();


/* =========================================================
   CAMERA READY
   ========================================================= */

video.addEventListener(
    "loadeddata",
    () => {

        setTimeout(
            () => {

                if (!firstDetection) {

                    startup.classList.add(
                        "hidden"
                    );

                    status.classList.add(
                        "active"
                    );
                }

            },
            1800
        );

    }
);

</script>

</body>
</html>
