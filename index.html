<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>STARK // J.A.R.V.I.S. OS V2</title>

<style>
:root{
  --cyan:#00f0ff;
  --cyan2:#00aaff;
  --blue:#087cff;
  --green:#00ff88;
  --red:#ff3155;
  --yellow:#ffe600;
  --white:#eaffff;
  --bg:#010408;
  --panel:rgba(2,12,22,.68);
  --line:rgba(0,240,255,.25);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#010307;
}

body{
  color:var(--cyan);
  font-family:
    "Consolas",
    "Courier New",
    monospace;
  user-select:none;
  cursor:crosshair;
}

/* =========================================================
   CORE
========================================================= */

#app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(
      circle at center,
      rgba(0,80,120,.08),
      transparent 55%
    ),
    #010307;
}

canvas,
video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#webcam{
  object-fit:cover;
  transform:scaleX(-1);
  opacity:.24;
  filter:
    contrast(140%)
    brightness(65%)
    saturate(60%)
    hue-rotate(155deg);
}

#backgroundCanvas{
  z-index:1;
}

#fxCanvas{
  z-index:5;
  pointer-events:none;
}

#hudCanvas{
  z-index:10;
  pointer-events:none;
}

#webcam{
  z-index:2;
}

/* =========================================================
   SCANLINES
========================================================= */

#scanlines{
  position:absolute;
  inset:0;
  z-index:50;
  pointer-events:none;
  opacity:.14;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,240,255,.12) 3px,
      transparent 4px
    );
  mix-blend-mode:screen;
}

#vignette{
  position:absolute;
  inset:0;
  z-index:51;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(0,0,0,.42) 100%
    );
}

/* =========================================================
   TOP BAR
========================================================= */

#topBar{
  position:absolute;
  z-index:100;
  top:0;
  left:0;
  right:0;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 25px;

  background:
    linear-gradient(
      180deg,
      rgba(0,15,28,.92),
      rgba(0,8,15,.55)
    );

  border-bottom:1px solid var(--line);

  box-shadow:
    0 0 30px rgba(0,240,255,.08);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logoCore{
  width:28px;
  height:28px;
  border:2px solid var(--cyan);
  border-radius:50%;
  position:relative;
  box-shadow:
    0 0 8px var(--cyan),
    inset 0 0 8px var(--cyan);
}

.logoCore::before,
.logoCore::after{
  content:"";
  position:absolute;
  background:var(--cyan);
}

.logoCore::before{
  width:100%;
  height:1px;
  top:50%;
  left:0;
}

.logoCore::after{
  width:1px;
  height:100%;
  top:0;
  left:50%;
}

.logoText{
  font-size:15px;
  letter-spacing:4px;
  color:white;
  text-shadow:0 0 10px var(--cyan);
}

.logoSub{
  color:var(--cyan);
  font-size:9px;
  letter-spacing:2px;
}

.topStatus{
  display:flex;
  align-items:center;
  gap:22px;
  font-size:10px;
  letter-spacing:1px;
}

.statusDot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
  margin-right:6px;
}

/* =========================================================
   HUD PANELS
========================================================= */

.panel{
  position:absolute;
  z-index:80;
  min-width:190px;
  padding:13px 15px;

  background:
    linear-gradient(
      135deg,
      rgba(0,25,40,.72),
      rgba(0,5,12,.62)
    );

  border:1px solid rgba(0,240,255,.28);

  box-shadow:
    0 0 20px rgba(0,240,255,.08),
    inset 0 0 20px rgba(0,240,255,.025);

  backdrop-filter:blur(7px);

  font-size:10px;
  line-height:1.7;
  letter-spacing:1px;

  clip-path:
    polygon(
      0 0,
      calc(100% - 12px) 0,
      100% 12px,
      100% 100%,
      12px 100%,
      0 calc(100% - 12px)
    );
}

.panel::before{
  content:"";
  position:absolute;
  top:-1px;
  left:0;
  width:35%;
  height:2px;
  background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);
}

.panelTitle{
  color:white;
  font-weight:bold;
  font-size:12px;
  letter-spacing:2px;
  margin-bottom:5px;
  text-shadow:0 0 8px var(--cyan);
}

.green{
  color:var(--green);
}

.yellow{
  color:var(--yellow);
}

.red{
  color:var(--red);
}

.white{
  color:white;
}

.dim{
  color:rgba(0,240,255,.55);
}

.value{
  float:right;
  color:white;
}

#panelSystem{
  top:78px;
  left:20px;
}

#panelTracking{
  top:78px;
  right:20px;
  text-align:right;
}

#panelTelemetry{
  bottom:80px;
  left:20px;
}

#panelMission{
  bottom:80px;
  right:20px;
  text-align:right;
}

/* =========================================================
   CENTER CORE
========================================================= */

#core{
  position:absolute;
  z-index:30;
  left:50%;
  top:50%;
  width:250px;
  height:250px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.coreRing{
  position:absolute;
  inset:0;
  border:1px solid rgba(0,240,255,.18);
  border-radius:50%;
  animation:spin 14s linear infinite;
}

.coreRing:nth-child(2){
  inset:25px;
  border-style:dashed;
  animation-duration:9s;
  animation-direction:reverse;
}

.coreRing:nth-child(3){
  inset:58px;
  border-color:rgba(0,240,255,.35);
  animation-duration:5s;
}

.coreCenter{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:white;
  box-shadow:
    0 0 10px white,
    0 0 25px var(--cyan),
    0 0 60px var(--cyan);
  animation:pulse 1.4s ease-in-out infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes pulse{
  50%{
    transform:translate(-50%,-50%) scale(.55);
    opacity:.6;
  }
}

/* =========================================================
   BOTTOM COMMAND BAR
========================================================= */

#commandBar{
  position:absolute;
  z-index:110;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);

  width:min(680px,80vw);
  height:35px;

  display:flex;
  align-items:center;

  border:1px solid rgba(0,240,255,.35);
  background:rgba(0,8,16,.8);

  box-shadow:0 0 20px rgba(0,240,255,.08);
}

#prompt{
  padding:0 10px;
  color:var(--green);
}

#commandInput{
  flex:1;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-family:inherit;
  font-size:11px;
  letter-spacing:1px;
}

#commandInput::placeholder{
  color:rgba(0,240,255,.35);
}

/* =========================================================
   NOTIFICATIONS
========================================================= */

#notifications{
  position:absolute;
  z-index:200;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  width:330px;
  pointer-events:none;
}

.notification{
  margin-bottom:7px;
  padding:9px 13px;

  background:rgba(0,15,25,.85);
  border-left:3px solid var(--cyan);

  box-shadow:
    0 0 20px rgba(0,240,255,.12);

  font-size:10px;
  animation:
    notifyIn .25s ease-out,
    notifyOut .4s ease-in 3.
